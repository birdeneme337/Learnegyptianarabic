<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mısır Arapçası Öğren</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #ce1126; /* Mısır Bayrağı Kırmızısı */
            --secondary-color: #000000;
            --accent-color: #c09300; /* Altın Sarısı */
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 { margin-bottom: 10px; }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background-color: #ddd;
            cursor: pointer;
            font-weight: bold;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .section {
            display: none;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .section.active { display: block; }

        /* Form Bilesenleri */
        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .arabic-input {
            direction: rtl;
            font-size: 18px;
        }

        button.action-btn {
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button.action-btn:hover { opacity: 0.9; }

        /* Kelime Kartlari */
        .flashcard {
            width: 100%;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 12px;
        }

        .flashcard.flipped .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front, .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            background-color: var(--card-bg);
            border: 2px solid var(--accent-color);
        }

        .flashcard-front { font-size: 28px; font-weight: bold; }
        .flashcard-back { transform: rotateY(180deg); font-size: 22px; background-color: #fff9e6; }
        .phonetic { font-size: 16px; color: #666; margin-top: 5px; }

        .card-controls {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        /* Liste */
        .word-list {
            list-style: none;
            padding: 0;
            max-height: 300px;
            overflow-y: auto;
        }

        .word-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .delete-btn {
            background-color: #ff4d4d;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Oyun Sekmesi */
        .game-option {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
        }
        .game-option:hover { background: #e0e0e0; }
        .score-board { font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

    <h1>Mısır Arapçası Öğren 🇪🇬</h1>

    <div class="container">
        <!-- Sekme Butonlari -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('add-tab')">Ekle & Liste</button>
            <button class="tab-btn" onclick="switchTab('cards-tab')">Kartlar</button>
            <button class="tab-btn" onclick="switchTab('game-tab')">Oyun</button>
        </div>

        <!-- 1. Ekle ve Liste Sekmesi -->
        <div id="add-tab" class="section active">
            <h3>Yeni Kelime/Cümle Ekle</h3>
            <form id="add-form">
                <input type="text" id="ar-text" class="arabic-input" placeholder="Arapçası (ör: إزيك)" required>
                <input type="text" id="read-text" placeholder="Okunuşu (ör: Izzayyak)" required>
                <input type="text" id="tr-text" placeholder="Türkçe Anlamı (ör: Nasılsın?)" required>
                <button type="submit" class="action-btn">Kaydet</button>
            </form>

            <h3 style="margin-top: 30px;">Kayıtlı Kelimeler (<span id="word-count">0</span>)</h3>
            <ul id="word-list" class="word-list"></ul>
        </div>

        <!-- 2. Kelime Kartlari Sekmesi -->
        <div id="cards-tab" class="section">
            <div id="card-container">
                <div class="flashcard" onclick="this.classList.toggle('flipped')">
                    <div class="flashcard-inner">
                        <div class="flashcard-front">
                            <span id="card-ar">-</span>
                            <span id="card-read" class="phonetic">-</span>
                        </div>
                        <div class="flashcard-back">
                            <span id="card-tr">-</span>
                        </div>
                    </div>
                </div>
                <div class="card-controls">
                    <button class="action-btn" onclick="prevCard()">Önceki</button>
                    <button class="action-btn" onclick="nextCard()">Sonraki</button>
                </div>
            </div>
        </div>

        <!-- 3. Oyun Sekmesi -->
        <div id="game-tab" class="section">
            <div class="score-board">Puan: <span id="score">0</span></div>
            <div id="game-container">
                <p>Aşağıdaki Mısır Arapçası ifadenin Türkçe karşılığı nedir?</p>
                <h2 id="game-question" class="arabic-input" style="text-align: center;">-</h2>
                <div id="game-options"></div>
            </div>
        </div>
    </div>

    <script>
        // Baslangic verileri (Varsayilan Misir Arapcasi Kelimeler)
        const defaultWords = [
            { ar: "إزيك", read: "Izzayyak", tr: "Nasılsın? (Erkeğe)" },
            { ar: "عامل إيه", read: "Amil eh", tr: "Ne haber? / Ne yapıyorsun?" },
            { ar: "كويس", read: "Koyyis", tr: "İyiyim" },
            { ar: "شُكراً", read: "Shukran", tr: "Teşekkürler" },
            { ar: "عايز", read: "Ayiz", tr: "İstiyorum (Erkek)" }
        ];

        let words = JSON.parse(localStorage.getItem('egyptianWords')) || defaultWords;
        let currentCardIndex = 0;
        let score = 0;
        let currentGameCorrectAnswer = "";

        // Verileri kaydet
        function saveWords() {
            localStorage.setItem('egyptianWords', JSON.stringify(words));
            updateWordList();
        }

        // Sekme degistirme
        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');

            if (tabId === 'cards-tab') showCard(currentCardIndex);
            if (tabId === 'game-tab') startNewGameRound();
        }

        // Form Gönderimi (Yeni Kelime Ekleme)
        document.getElementById('add-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const ar = document.getElementById('ar-text').value;
            const read = document.getElementById('read-text').value;
            const tr = document.getElementById('tr-text').value;

            words.push({ ar, read, tr });
            saveWords();

            this.reset();
            alert('Kelime başarıyla eklendi!');
        });

        // Liste Güncelleme
        function updateWordList() {
            const listEl = document.getElementById('word-list');
            listEl.innerHTML = '';
            document.getElementById('word-count').innerText = words.length;

            words.forEach((item, index) => {
                const li = document.createElement('li');
                li.className = 'word-item';
                li.innerHTML = `
                    <div>
                        <strong>${item.ar}</strong> (${item.read}) - ${item.tr}
                    </div>
                    <button class="delete-btn" onclick="deleteWord(${index})">Sil</button>
                `;
                listEl.appendChild(li);
            });
        }

        function deleteWord(index) {
            words.splice(index, 1);
            saveWords();
        }

        // Kelime Kartlari
        function showCard(index) {
            if (words.length === 0) {
                document.getElementById('card-ar').innerText = "Kelime yok";
                document.getElementById('card-read').innerText = "";
                document.getElementById('card-tr').innerText = "Lütfen kelime ekleyin.";
                return;
            }
            const card = words[index];
            document.getElementById('card-ar').innerText = card.ar;
            document.getElementById('card-read').innerText = card.read;
            document.getElementById('card-tr').innerText = card.tr;
            
            // Kart cevrilmisse sifirla
            document.querySelector('.flashcard').classList.remove('flipped');
        }

        function nextCard() {
            if (words.length === 0) return;
            currentCardIndex = (currentCardIndex + 1) % words.length;
            showCard(currentCardIndex);
        }

        function prevCard() {
            if (words.length === 0) return;
            currentCardIndex = (currentCardIndex - 1 + words.length) % words.length;
            showCard(currentCardIndex);
        }

        // Oyun Modu (Coktan Seçmeli Test)
        function startNewGameRound() {
            if (words.length < 2) {
                document.getElementById('game-container').innerHTML = "<p>Oyun oynamak için en az 2 kelime eklemelisiniz.</p>";
                return;
            }

            const randomWord = words[Math.floor(Math.random() * words.length)];
            currentGameCorrectAnswer = randomWord.tr;

            document.getElementById('game-question').innerText = `${randomWord.ar} (${randomWord.read})`;

            // Seçenekleri hazirla (1 dogru, 2 rastgele yanlis)
            let options = [randomWord.tr];
            while (options.length < Math.min(3, words.length)) {
                let randomOption = words[Math.floor(Math.random() * words.length)].tr;
                if (!options.includes(randomOption)) {
                    options.push(randomOption);
                }
            }

            // Seçenekleri karistir
            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('game-options');
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'game-option';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected) {
            if (selected === currentGameCorrectAnswer) {
                score += 10;
                alert('Tebrikler! Doğru cevap.');
            } else {
                alert(`Yanlış! Doğru cevap: ${currentGameCorrectAnswer}`);
            }
            document.getElementById('score').innerText = score;
            startNewGameRound();
        }

        // Sayfa yuklendiginde listeyi doldur
        updateWordList();
    </script>
</body>
</html>
