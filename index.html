<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <!-- Mobil cihazlarda düzgün ölçeklenme sağlayan kritik etiket -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mısır Arapçası Öğren</title>
    
    <style>
        /* GENEL BİLGİSAYAR / WEB MASAÜSTÜ STİLLERİ */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            width: 80%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header {
            text-align: center;
            padding: 20px 0;
            background-color: #1e293b;
            color: #ffffff;
            border-radius: 8px 8px 0 0;
        }

        .content {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .main-text {
            flex: 2;
        }

        .sidebar {
            flex: 1;
            background-color: #e2e8f0;
            padding: 15px;
            border-radius: 6px;
        }

        /* MOBİL CİHAZ UYUMLULUK KODLARI (@media queries) */
        /* Ekran genişliği 768px veya daha az olduğunda (Telefon ve Küçük Tabletler) çalışır */
        @media (max-width: 768px) {
            .container {
                width: 95%; /* Mobil ekranda kenar boşluklarını daraltır */
                padding: 10px;
                margin: 10px auto;
            }

            .content {
                flex-direction: column; /* Yan yana olan içerikleri mobilde alt alta getirir */
            }

            header h1 {
                font-size: 20px; /* Mobil ekran için başlık boyutunu küçültür */
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Mısır Arapçası Öğren</h1>
        </header>

        <div class="content">
            <div class="main-text">
                <h2>Hoş Geldiniz</h2>
                <p>Bu site hem bilgisayardan hem de mobil cihazlardan girildiğinde ekran boyutuna otomatik uyum sağlar.</p>
            </div>
            <div class="sidebar">
                <h3>Yan Menü</h3>
                <p>Mobilde alt tarafa geçer, bilgisayarda sağ tarafta görünür.</p>
            </div>
        </div>
    </div>

</body>
</html>
