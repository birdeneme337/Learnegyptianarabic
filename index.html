<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mısır Arapçası Öğren - Masri</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #CE1126;
            --primary-dark: #A00D1E;
            --secondary: #000000;
            --accent: #C09300;
            --accent-light: #FFF8E7;
            --bg: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --success: #10B981;
            --danger: #EF4444;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 8px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            --shadow-active: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-dark);
        }

        /* Mobile Container Frame */
        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            max-height: 932px;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        @media (min-width: 440px) {
            .app-container {
                height: 880px;
                border-radius: 40px;
                border: 8px solid #1F2937;
            }
        }

        /* App Header */
        .app-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 20px 20px 15px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(206, 17, 38, 0.2);
            z-index: 10;
        }

        .app-header h1 {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .app-header p {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        /* Main Content Scrollable Area */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            padding-bottom: 90px;
            scroll-behavior: smooth;
        }

        /* View Switching */
        .view {
            display: none;
            animation: fadeIn 0.25s ease-in-out;
        }

        .view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Category Filter Pills */
        .filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .filter-container::-webkit-scrollbar { display: none; }

        .filter-pill {
            padding: 8px 14px;
            background: white;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-pill.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 10px rgba(206, 17, 38, 0.25);
        }

        /* Level Badges */
        .badge-level {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            text-transform: uppercase;
        }
        .lvl-a1 { background: #E0F2FE; color: #0369A1; }
        .lvl-a2 { background: #FEF3C7; color: #B45309; }
        .lvl-b1 { background: #FCE7F3; color: #BE185D; }

        /* Search Box */
        .search-box {
            position: relative;
            margin-bottom: 15px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: white;
            font-size: 14px;
            outline: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .search-box svg {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            fill: var(--text-muted);
            width: 16px;
            height: 16px;
        }

        /* Word Cards List */
        .word-card {
            background: white;
            border-radius: var(--radius-md);
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            border: 1px solid rgba(0,0,0,0.03);
        }

        .word-info {
            flex: 1;
        }

        .word-ar {
            font-family: 'Cairo', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--secondary);
            direction: rtl;
            line-height: 1.3;
        }

        .word-read {
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            margin-top: 2px;
        }

        .word-tr {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .word-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }

        .category-tag {
            font-size: 10px;
            background: #F1F5F9;
            color: #475569;
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* Action Buttons */
        .btn-audio {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-light);
            border: 1px solid rgba(192, 147, 0, 0.2);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-left: 10px;
            transition: transform 0.1s, background 0.2s;
            flex-shrink: 0;
        }
        .btn-audio:active {
            transform: scale(0.92);
            background: #FDE68A;
        }

        /* Flashcards Section */
        .flashcard-wrapper {
            perspective: 1000px;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .flashcard {
            width: 100%;
            height: 280px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: var(--radius-lg);
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
            background: white;
            border: 2px solid var(--border-color);
            text-align: center;
        }

        .card-front {
            border-top: 6px solid var(--primary);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(180deg, #FFFFFF 0%, #FFFDF5 100%);
            border-top: 6px solid var(--accent);
        }

        .card-hint {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .flashcard-ar {
            font-family: 'Cairo', sans-serif;
            font-size: 34px;
            font-weight: 800;
            color: var(--secondary);
            margin-top: 10px;
        }

        .flashcard-read {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
        }

        .flashcard-tr {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin: auto 0;
        }

        .card-nav {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn-nav {
            flex: 1;
            padding: 14px;
            border-radius: var(--radius-md);
            border: none;
            background: white;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 14px;
            box-shadow: var(--shadow);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-nav:active { background: #F1F5F9; }

        /* Add Form */
        .form-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 14px;
            outline: none;
        }
        .form-control:focus {
            border-color: var(--primary);
        }

        .ar-input {
            font-family: 'Cairo', sans-serif;
            direction: rtl;
            font-size: 18px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(206, 17, 38, 0.3);
            transition: background 0.2s;
        }
        .btn-primary:active { background: var(--primary-dark); }

        /* Quiz Game */
        .quiz-card {
            background: white;
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        .quiz-score-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .score-box {
            background: #FEF3C7;
            color: #92400E;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
        }

        .quiz-question-box {
            background: var(--bg);
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 20px;
        }

        .quiz-ar {
            font-family: 'Cairo', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--secondary);
        }

        .quiz-read {
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 4px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-btn {
            width: 100%;
            padding: 14px 16px;
            background: white;
            border: 2px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:active {
            border-color: var(--primary);
            background: #FFF5F5;
        }

        .option-btn.correct {
            background: #D1FAE5 !important;
            border-color: var(--success) !important;
            color: #065F46 !important;
        }

        .option-btn.wrong {
            background: #FEE2E2 !important;
            border-color: var(--danger) !important;
            color: #991B1B !important;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: white;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 10px;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            width: 25%;
            height: 100%;
            gap: 4px;
            transition: color 0.2s;
        }

        .nav-item svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .nav-item.active {
            color: var(--primary);
        }

        /* Delete Button */
        .btn-delete {
            background: none;
            border: none;
            color: #94A3B8;
            padding: 6px;
            cursor: pointer;
            margin-left: 4px;
        }
        .btn-delete:hover { color: var(--danger); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <h1>🇪🇬 Masri - Mısır Arapçası</h1>
            <p>Kelime, Cümle ve Telaffuz Rehberi</p>
        </div>

        <!-- Scrollable Content Area -->
        <div class="content-area">

            <!-- VIEW 1: WORD LIST -->
            <div id="view-words" class="view active">
                <div class="search-box">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="search-input" placeholder="Kelime veya anlam ara..." oninput="filterWords()">
                </div>

                <!-- Category Filters -->
                <div class="filter-container" id="category-filters">
                    <button class="filter-pill active" onclick="setCategoryFilter('all', this)">Tümü</button>
                    <button class="filter-pill" onclick="setCategoryFilter('Günlük İfadeler', this)">Günlük İfadeler</button>
                    <button class="filter-pill" onclick="setCategoryFilter('Restoran & Yemek', this)">Restoran</button>
                    <button class="filter-pill" onclick="setCategoryFilter('Gezi & Yönler', this)">Gezi & Yönler</button>
                    <button class="filter-pill" onclick="setCategoryFilter('Sayılar', this)">Sayılar</button>
                    <button class="filter-pill" onclick="setCategoryFilter('Renkler', this)">Renkler</button>
                    <button class="filter-pill" onclick="setCategoryFilter('Günler & Aylar', this)">Günler/Aylar</button>
                    <button class="filter-pill" onclick="setCategoryFilter('Mevsimler', this)">Mevsimler</button>
                </div>

                <!-- Level Filters -->
                <div class="filter-container" id="level-filters" style="margin-bottom: 15px;">
                    <button class="filter-pill active" onclick="setLevelFilter('all', this)">Tüm Seviyeler</button>
                    <button class="filter-pill" onclick="setLevelFilter('A1', this)">A1 (Başlangıç)</button>
                    <button class="filter-pill" onclick="setLevelFilter('A2', this)">A2 (Orta)</button>
                    <button class="filter-pill" onclick="setLevelFilter('B1', this)">B1 (İleri)</button>
                </div>

                <div id="words-list-container">
                    <!-- Word Items injected here -->
                </div>
            </div>

            <!-- VIEW 2: FLASHCARDS -->
            <div id="view-cards" class="view">
                <div class="filter-container" id="card-category-filters">
                    <button class="filter-pill active" onclick="setCardCategoryFilter('all', this)">Tüm Konular</button>
                    <button class="filter-pill" onclick="setCardCategoryFilter('Restoran & Yemek', this)">Restoran</button>
                    <button class="filter-pill" onclick="setCardCategoryFilter('Gezi & Yönler', this)">Gezi</button>
                    <button class="filter-pill" onclick="setCardCategoryFilter('Günlük İfadeler', this)">Günlük</button>
                </div>

                <div class="flashcard-wrapper">
                    <div class="flashcard" id="main-flashcard" onclick="flipCard()">
                        <div class="card-face card-front">
                            <span class="card-hint">Mısır Arapçası (Dokun Çevir)</span>
                            <div>
                                <div class="flashcard-ar" id="fc-ar">-</div>
                                <div class="flashcard-read" id="fc-read">-</div>
                            </div>
                            <button class="btn-audio" onclick="event.stopPropagation(); speakCurrentCard()">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </button>
                        </div>
                        <div class="card-face card-back">
                            <span class="card-hint">Türkçe Anlamı</span>
                            <div class="flashcard-tr" id="fc-tr">-</div>
                            <span class="badge-level lvl-a1" id="fc-lvl">A1</span>
                        </div>
                    </div>
                </div>

                <div class="card-nav">
                    <button class="btn-nav" onclick="prevCard()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                        Önceki
                    </button>
                    <button class="btn-nav" onclick="nextCard()">
                        Sonraki
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                    </button>
                </div>
            </div>

            <!-- VIEW 3: ADD NEW WORD -->
            <div id="view-add" class="view">
                <div class="form-card">
                    <h2 style="font-size: 18px; margin-bottom: 15px; color: var(--text-dark);">Yeni Kelime / Cümle Ekle</h2>
                    <form id="add-word-form" onsubmit="handleAddWord(event)">
                        <div class="form-group">
                            <label>Arapça (Mısır Diyalekti)</label>
                            <input type="text" id="input-ar" class="form-control ar-input" placeholder="ör: عايز اكل" required>
                        </div>
                        <div class="form-group">
                            <label>Okunuşu (Okunuş Rehberi)</label>
                            <input type="text" id="input-read" class="form-control" placeholder="ör: Ayiz akil" required>
                        </div>
                        <div class="form-group">
                            <label>Türkçe Anlamı</label>
                            <input type="text" id="input-tr" class="form-control" placeholder="ör: Yemek yemek istiyorum" required>
                        </div>
                        <div class="form-group">
                            <label>Kategori</label>
                            <select id="input-cat" class="form-control">
                                <option value="Günlük İfadeler">Günlük İfadeler</option>
                                <option value="Restoran & Yemek">Restoran & Yemek</option>
                                <option value="Gezi & Yönler">Gezi & Yönler</option>
                                <option value="Sayılar">Sayılar</option>
                                <option value="Renkler">Renkler</option>
                                <option value="Günler & Aylar">Günler & Aylar</option>
                                <option value="Mevsimler">Mevsimler</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Seviye</label>
                            <select id="input-lvl" class="form-control">
                                <option value="A1">A1 (Başlangıç)</option>
                                <option value="A2">A2 (Orta)</option>
                                <option value="B1">B1 (İleri)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn-primary" style="margin-top: 10px;">Kaydet ve Ekle</button>
                    </form>
                </div>
            </div>

            <!-- VIEW 4: QUIZ GAME -->
            <div id="view-quiz" class="view">
                <div class="quiz-card">
                    <div class="quiz-score-header">
                        <span style="font-weight: 700; font-size: 14px;">Mısır Arapçası Testi</span>
                        <span class="score-box">Puan: <span id="quiz-score">0</span></span>
                    </div>

                    <div class="quiz-question-box">
                        <div class="quiz-ar" id="quiz-ar-text">-</div>
                        <div class="quiz-read" id="quiz-read-text">-</div>
                        <button class="btn-audio" style="margin: 10px auto 0 auto;" onclick="speakQuizQuestion()">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                        </button>
                    </div>

                    <div class="quiz-options" id="quiz-options-container">
                        <!-- Options injected here -->
                    </div>
                </div>
            </div>

        </div>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchNav('view-words', this)">
                <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
                Kelimeler
            </div>
            <div class="nav-item" onclick="switchNav('view-cards', this)">
                <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 10h2v7H7zm4-3h2v10h-2zm4 6h2v4h-2z"/></svg>
                Kartlar
            </div>
            <div class="nav-item" onclick="switchNav('view-add', this)">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Ekle
            </div>
            <div class="nav-item" onclick="switchNav('view-quiz', this)">

            { ar: "واحد", read: "Wahid", tr: "1 (Bir)", cat: "Sayılar", lvl: "A1" },

            { ar: "أسود", read: "Eswed", tr: "Siyah", cat: "Renkler", lvl: "A1" },

            // GÜNLER & AYLAR (A1 - A2)
            { ar: "النهاردة", read: "En-naharda", tr: "Bugün", cat: "Günler & Aylar", lvl: "A1" },
            { ar: "بكرة", read: "Bokra", tr: "Yarın", cat: "Günler & Aylar", lvl: "A1" },
            { ar: "مبارح", read: "Embareh", tr: "Dün", cat: "Günler & Aylar", lvl: "A1" },
            { ar: "يوم الأحد", read: "Yom el-ahad", tr: "Pazar", cat: "Günler & Aylar", lvl: "A2" },
            { ar: "يوم الجمعة", read: "Yom el-gom'a", tr: "Cuma", cat: "Günler & Aylar", lvl: "A2" },
            { ar: "شهر يناير", read: "Shahri Yanayer", tr: "Ocak Ayı", cat: "Günler & Aylar", lvl: "A2" },

            // MEVSİMLER (A2)
            { ar: "الصيف", read: "Es-sef", tr: "Yaz", cat: "Mevsimler", lvl: "A2" },
            { ar: "الشتا", read: "Esh-sheta", tr: "Kış", cat: "Mevsimler", lvl: "A2" },
            { ar: "الربيع", read: "Er-rabee'a", tr: "İlkbahar", cat: "Mevsimler", lvl: "A2" },
            { ar: "الخريف", read: "El-khareef", tr: "Sonbahar", cat: "Mevsimler", lvl: "A2" },

            // İLERİ DÜZEY CÜMLELER (B1)
            { ar: "ممكن تساعدني لو سمحت؟", read: "Mumkin tisa'idni law samaht?", tr: "Bana yardım edebilir misiniz lütfen?", cat: "Günlük İfadeler", lvl: "B1" },
            { ar: "أنا باتكلم عربي شوية صغيرين", read: "Ana batkallem arabi shwayya sugayayreen", tr: "Sadece biraz Arapça konuşabiliyorum", cat: "Günlük İfadeler", lvl: "B1" },
            { ar: "أنا مش فاهم قصدك إيه", read: "Ana mish fahim asdak eh", tr: "Ne demek istediğinizi anlamıyorum", cat: "Günlük İfadeler", lvl: "B1" }
        ];

        // App State
        let dataset = JSON.parse(localStorage.getItem('masri_dataset_v1')) || defaultDataset;
        let filteredDataset = [...dataset];
        let currentCardIndex = 0;
        let cardFilteredDataset = [...dataset];
        let quizScore = 0;
        let currentQuizItem = null;

        let activeCategory = 'all';
        let activeLevel = 'all';

        // Init Speech Synthesis
        const synth = window.speechSynthesis;

        // Speak function using Web Speech API (Egyptian / Arabic accent fallback)
        function speakArabic(text) {
            if (!synth) {
                alert("Cihazınız seslendirmeyi desteklemiyor.");
                return;
            }
            synth.cancel(); // Stop current speaking

            const utterance = new SpeechSynthesisUtterance(text);
            
            // Try to find Arabic voices (ar-EG for Egyptian Arabic preferred, or general ar)
            const voices = synth.getVoices();
            const egVoice = voices.find(v => v.lang === 'ar-EG') || voices.find(v => v.lang.startsWith('ar'));

            if (egVoice) {
                utterance.voice = egVoice;
            }
            utterance.lang = 'ar-EG';
            utterance.rate = 0.85; // Slightly slower for better comprehension

            synth.speak(utterance);
        }

        // Initialize App
        document.addEventListener('DOMContentLoaded', () => {
            renderWordList();
            setupFlashcards();
            setupQuiz();
            
            // Chrome voice loading fix
            if (speechSynthesis.onvoiceschanged !== undefined) {
                speechSynthesis.onvoiceschanged = () => synth.getVoices();
            }
        });

        // Navigation Switcher
        function switchNav(viewId, element) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');
            element.classList.add('active');

            if (viewId === 'view-cards') setupFlashcards();
            if (viewId === 'view-quiz') setupQuiz();
        }

        // Filter Words List
        function filterWords() {
            const query = document.getElementById('search-input').value.toLowerCase();
            filteredDataset = dataset.filter(item => {
                const matchesSearch = item.ar.includes(query) || 
                                     item.read.toLowerCase().includes(query) || 
                                     item.tr.toLowerCase().includes(query);
                const matchesCat = (activeCategory === 'all') || (item.cat === activeCategory);
                const matchesLvl = (activeLevel === 'all') || (item.lvl === activeLevel);

                return matchesSearch && matchesCat && matchesLvl;
            });
            renderWordList();
        }

        function setCategoryFilter(cat, el) {
            document.querySelectorAll('#category-filters .filter-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            activeCategory = cat;
            filterWords();
        }

        function setLevelFilter(lvl, el) {
            document.querySelectorAll('#level-filters .filter-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            activeLevel = lvl;
            filterWords();
        }

        // Render Word List
        function renderWordList() {
            const container = document.getElementById('words-list-container');
            container.innerHTML = '';

            if (filteredDataset.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 40px; color: var(--text-muted);">Kelime bulunamadı.</div>';
                return;
            }

            filteredDataset.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'word-card';
                card.innerHTML = `
                    <div class="word-info">
                        <div class="word-ar">${item.ar}</div>
                        <div class="word-read">${item.read}</div>
                        <div class="word-tr">${item.tr}</div>
                        <div class="word-meta">
                            <span class="category-tag">${item.cat}</span>
                            <span class="badge-level lvl-${item.lvl.toLowerCase()}">${item.lvl}</span>
                        </div>
                    </div>
                    <button class="btn-audio" onclick="speakArabic('${item.ar.replace(/'/g, "\'")}')">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
                    </button>
                    <button class="btn-delete" onclick="deleteWord(${dataset.indexOf(item)})">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    </button>
                `;
                container.appendChild(card);
            });
        }

        // Add New Word
        function handleAddWord(e) {
            e.preventDefault();
            const ar = document.getElementById('input-ar').value;
            const read = document.getElementById('input-read').value;
            const tr = document.getElementById('input-tr').value;
            const cat = document.getElementById('input-cat').value;
            const lvl = document.getElementById('input-lvl').value;

            dataset.unshift({ ar, read, tr, cat, lvl });
            localStorage.setItem('masri_dataset_v1', JSON.stringify(dataset));

            document.getElementById('add-word-form').reset();
            alert('Yeni kelime eklendi!');
            
            filterWords();
            switchNav('view-words', document.querySelectorAll('.nav-item')[0]);
        }

        // Delete Word
        function deleteWord(index) {
            if (confirm('Bu kelimeyi silmek istediğinize emin misiniz?')) {
                dataset.splice(index, 1);
                localStorage.setItem('masri_dataset_v1', JSON.stringify(dataset));
                filterWords();
            }
        }

        // Flashcards Logic
        function setupFlashcards() {
            currentCardIndex = 0;
            renderCard();
        }

        function setCardCategoryFilter(cat, el) {
            document.querySelectorAll('#card-category-filters .filter-pill').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            
            if (cat === 'all') {
                cardFilteredDataset = [...dataset];
            } else {
                cardFilteredDataset = dataset.filter(d => d.cat === cat);
            }
            currentCardIndex = 0;
            renderCard();
        }

        function renderCard() {
            const cardEl = document.getElementById('main-flashcard');
            cardEl.classList.remove('flipped');

            if (cardFilteredDataset.length === 0) {
                document.getElementById('fc-ar').innerText = "-";
                document.getElementById('fc-read').innerText = "Kelime Bulunamadı";
                document.getElementById('fc-tr').innerText = "Bu kategoride kelime yok";
                return;
            }

            const item = cardFilteredDataset[currentCardIndex];
            document.getElementById('fc-ar').innerText = item.ar;
            document.getElementById('fc-read').innerText = item.read;
            document.getElementById('fc-tr').innerText = item.tr;
            document.getElementById('fc-lvl').innerText = item.lvl;
            document.getElementById('fc-lvl').className = `badge-level lvl-${item.lvl.toLowerCase()}`;
        }

        function flipCard() {
            document.getElementById('main-flashcard').classList.toggle('flipped');
        }

        function nextCard() {
            if (cardFilteredDataset.length === 0) return;
            currentCardIndex = (currentCardIndex + 1) % cardFilteredDataset.length;
            renderCard();
        }

        function prevCard() {
            if (cardFilteredDataset.length === 0) return;
            currentCardIndex = (currentCardIndex - 1 + cardFilteredDataset.length) % cardFilteredDataset.length;
            renderCard();
        }

        function speakCurrentCard() {
            if (cardFilteredDataset.length > 0) {
                speakArabic(cardFilteredDataset[currentCardIndex].ar);
            }
        }

        // Quiz Logic
        function setupQuiz() {
            if (dataset.length < 3) {
                document.getElementById('quiz-options-container').innerHTML = 'Test için en az 3 kelime eklemelisiniz.';
                return;
            }

            // Pick Random Question
            currentQuizItem = dataset[Math.floor(Math.random() * dataset.length)];
            document.getElementById('quiz-ar-text').innerText = currentQuizItem.ar;
            document.getElementById('quiz-read-text').innerText = currentQuizItem.read;

            // Generate Options (1 correct, 2 incorrect)
            let options = [currentQuizItem];
            while (options.length < 3) {
                let randomOpt = dataset[Math.floor(Math.random() * dataset.length)];
                if (!options.some(o => o.tr === randomOpt.tr)) {
                    options.push(randomOpt);
                }
            }

            // Shuffle Options
            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('quiz-options-container');
            optionsContainer.innerHTML = '';

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.tr;
                btn.onclick = () => checkQuizAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function speakQuizQuestion() {
            if (currentQuizItem) {
                speakArabic(currentQuizItem.ar);
            }
        }

        function checkQuizAnswer(selectedOpt, btnEl) {
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.onclick = null); // Disable all buttons

            if (selectedOpt.tr === currentQuizItem.tr) {
                btnEl.classList.add('correct');
                quizScore += 10;
                document.getElementById('quiz-score').innerText = quizScore;
            } else {
                btnEl.classList.add('wrong');
                // Highlight correct one
                allBtns.forEach(b => {
                    if (b.innerText === currentQuizItem.tr) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                setupQuiz();
            }, 1400);
        }
    </script>
